<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#3B82F6">
    <title>Trace & Learn - Draw Letters & Numbers!</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --color-blue: #3B82F6;
            --color-purple: #A855F7;
            --color-pink: #EC4899;
            --color-green: #10B981;
            --color-yellow: #FBBF24;
            --color-orange: #F97316;
            --color-red: #EF4444;
            --color-cyan: #06B6D4;

            --bg-start: #3B82F6;
            --bg-end: #A855F7;

            --line-width: 12px;
            --guide-color: #E5E7EB;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            padding-top: max(15px, env(safe-area-inset-top));
            gap: 10px;
            flex-shrink: 0;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 800;
            color: white;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
        }

        .current-item {
            background: white;
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--color-purple);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            min-width: 55px;
            min-height: 55px;
            border: none;
            border-radius: 50px;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:active { transform: scale(0.9); }
        .btn-white { background: white; color: var(--color-blue); }
        .btn-colored {
            background: linear-gradient(135deg, var(--color-green) 0%, var(--color-cyan) 100%);
            color: white;
        }
        .btn-yellow {
            background: linear-gradient(135deg, var(--color-yellow) 0%, var(--color-orange) 100%);
            color: white;
        }

        /* CANVAS AREA */
        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
        }

        .canvas-wrapper {
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            touch-action: none;
        }

        /* Hint text */
        .hint-text {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .hint-text.visible {
            opacity: 1;
        }

        /* COLOR PICKER */
        .color-picker {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: white;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .color-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 4px solid transparent;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .color-btn:active { transform: scale(0.9); }
        .color-btn.active {
            border-color: #1F2937;
            transform: scale(1.15);
        }

        /* NAVIGATION ARROWS */
        .nav-arrows {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            pointer-events: none;
        }

        .nav-btn {
            width: 50px;
            height: 80px;
            border: none;
            border-radius: 15px;
            background: rgba(255,255,255,0.9);
            font-size: 1.8rem;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:active { transform: scale(0.95); }

        /* CATEGORY SELECTOR */
        .category-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }

        .category-overlay.active { display: flex; }

        .category-panel {
            background: white;
            border-radius: 30px 30px 0 0;
            padding: 30px;
            padding-bottom: max(30px, env(safe-area-inset-bottom));
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .category-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1F2937;
            text-align: center;
            margin-bottom: 25px;
        }

        .category-group { margin-bottom: 25px; }

        .category-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #6B7280;
            margin-bottom: 12px;
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .category-btn {
            padding: 15px 25px;
            border: 3px solid #E5E7EB;
            border-radius: 16px;
            background: white;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .category-btn:active { transform: scale(0.95); }
        .category-btn.active {
            border-color: var(--color-blue);
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            color: var(--color-blue);
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .item-btn {
            aspect-ratio: 1;
            border: 3px solid #E5E7EB;
            border-radius: 16px;
            background: white;
            font-size: 1.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-btn:active { transform: scale(0.95); }
        .item-btn.active {
            border-color: var(--color-blue);
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            color: var(--color-blue);
        }

        .close-btn {
            width: 100%;
            padding: 18px;
            margin-top: 20px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--color-blue) 0%, var(--color-purple) 100%);
            color: white;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* CELEBRATION */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
        }

        .celebration.active { display: flex; }

        .celebration-content {
            text-align: center;
            animation: celebrate 0.5s ease forwards;
        }

        .celebration-shape {
            font-size: 10rem;
            animation: float 1s ease-in-out infinite;
        }

        .celebration-text {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin: 20px 0;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
        }

        .celebration-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .celebration .btn {
            padding: 18px 35px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* ANIMATIONS */
        @keyframes celebrate {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: confetti 3s ease-out forwards;
            pointer-events: none;
            z-index: 201;
        }

        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* RESPONSIVE */
        @media (max-width: 500px) {
            :root { --line-width: 10px; }
            .title { font-size: 1.1rem; }
            .current-item { font-size: 1.5rem; padding: 6px 18px; }
            .color-btn { width: 38px; height: 38px; }
            .color-picker { gap: 8px; padding: 10px 15px; }
            .nav-btn { width: 40px; height: 60px; font-size: 1.4rem; }
        }

        @media (min-width: 768px) {
            :root { --line-width: 16px; }
            .celebration-shape { font-size: 14rem; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            :root { --line-width: 8px; }
            .header { padding: 8px 15px; }
            .color-picker { bottom: 10px; }
            .nav-btn { height: 50px; }
        }
    </style>
</head>

                <div class="item-grid" id="itemGrid"></div>

            <button class="close-btn" id="closeMenuBtn">Done ✓</button>

                ],
                '❤️': [
                    [{x:50,y:88}, {x:18,y:55}, {x:12,y:35}, {x:22,y:20}, {x:38,y:18}, {x:50,y:32}],
                    [{x:50,y:32}, {x:62,y:18}, {x:78,y:20}, {x:88,y:35}, {x:82,y:55}, {x:50,y:88}]
                ],
                '🏠': [
                    [{x:15,y:50}, {x:50,y:15}, {x:85,y:50}],
                    [{x:25,y:50}, {x:25,y:88}, {x:75,y:88}, {x:75,y:50}],
                    [{x:40,y:88}, {x:40,y:65}, {x:60,y:65}, {x:60,y:88}]
                ],
                '🌙': [
                    [{x:72,y:12}, {x:52,y:10}, {x:32,y:18}, {x:18,y:35}, {x:15,y:55}, {x:22,y:75}, {x:42,y:88}, {x:65,y:88}, {x:80,y:75}],
                    [{x:80,y:75}, {x:62,y:68}, {x:55,y:50}, {x:60,y:30}, {x:72,y:12}]
                ],
                '◆': [
                    [{x:50,y:8}, {x:88,y:50}, {x:50,y:92}, {x:12,y:50}, {x:50,y:8}]
                ],
                '△': [
                    [{x:50,y:12}, {x:85,y:85}, {x:15,y:85}, {x:50,y:12}]
                ]
            }
        };

        // ===========================================
        // GAME STATE
        // ===========================================

        let gameState = {
            category: 'letters',
            currentItem: 'A',
            strokes: [],
            isDrawing: false,
            hasDrawn: false
        };

        let settings = {
            lineColor: '#EF4444',
            soundEnabled: true
        };

        let canvas, ctx;
        let canvasWidth = 400;
        let canvasHeight = 450;

        // ===========================================
        // AUDIO
        // ===========================================

        let audioContext = null;
        let audioUnlocked = false;

        async function initAudio() {
            if (!audioContext) {
                try { audioContext = new (window.AudioContext || window.webkitAudioContext)(); }
                catch (e) { return; }
            }
            if (audioContext.state === 'suspended') {
                try { await audioContext.resume(); } catch (e) {}
            }
            if (!audioUnlocked && audioContext.state === 'running') {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                gain.gain.value = 0.001;
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 0.001);
                audioUnlocked = true;
            }
        }

        function playTone(freq, dur, type = 'sine') {
            if (!settings.soundEnabled || !audioContext || audioContext.state !== 'running') return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = freq;
                osc.type = type;
                gain.gain.setValueAtTime(0.25, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + dur);
                osc.start(audioContext.currentTime);
                osc.stop(audioContext.currentTime + dur);
            } catch (e) {}
        }

        const sounds = {
            draw: () => playTone(440 + Math.random() * 200, 0.05),
            complete: () => {
                [523, 659, 784, 1047].forEach((f, i) => {
                    setTimeout(() => playTone(f, 0.15), i * 100);
                });
            }
        };

        // ===========================================
        // CANVAS
        // ===========================================

        function setupCanvas() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            const container = document.querySelector('.canvas-container');
            const maxWidth = container.clientWidth - 130;
            const maxHeight = container.clientHeight - 100;

            const ratio = 0.9;
            if (maxWidth / maxHeight > ratio) {
                canvasHeight = Math.min(maxHeight, 550);
                canvasWidth = canvasHeight * ratio;
            } else {
                canvasWidth = Math.min(maxWidth, 450);
                canvasHeight = canvasWidth / ratio;
            }

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';

            drawCanvas();
        }

        // ===========================================
        // DRAWING
        // ===========================================

        function drawCanvas() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Draw guide shape (light in background)
            drawGuideShape();

            // Draw user strokes
            drawUserStrokes();
        }

        function drawGuideShape() {
            const shapeData = SHAPE_DATA[gameState.category][gameState.currentItem];
            if (!shapeData) return;

            const lineWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--line-width'));

            ctx.strokeStyle = '#E0E0E0';
            ctx.lineWidth = lineWidth + 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.setLineDash([15, 10]);

            for (const stroke of shapeData) {
                if (stroke.length < 2) continue;
                ctx.beginPath();
                ctx.moveTo((stroke[0].x / 100) * canvasWidth, (stroke[0].y / 100) * canvasHeight);
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo((stroke[i].x / 100) * canvasWidth, (stroke[i].y / 100) * canvasHeight);
                }
                ctx.stroke();
            }

            ctx.setLineDash([]);
        }

        function drawUserStrokes() {
            if (gameState.strokes.length === 0) return;

            const lineWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--line-width'));

            ctx.strokeStyle = settings.lineColor;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (const stroke of gameState.strokes) {
                if (stroke.length < 2) continue;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo(stroke[i].x, stroke[i].y);
                }
                ctx.stroke();
            }
        }

        function loadItem(category, item) {
            gameState.category = category;
            gameState.currentItem = item;
            gameState.strokes = [];
            gameState.hasDrawn = false;

            document.getElementById('currentItem').textContent = item;
            document.getElementById('celebration').classList.remove('active');

            // Show hint briefly
            const hint = document.getElementById('hintText');
            hint.classList.add('visible');
            setTimeout(() => hint.classList.remove('visible'), 2500);

            drawCanvas();
        }

        // ===========================================
        // TOUCH/MOUSE HANDLERS
        // ===========================================

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            if (e.touches) {
                return {
                    x: (e.touches[0].clientX - rect.left) * scaleX,
                    y: (e.touches[0].clientY - rect.top) * scaleY
                };
            }
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function handleStart(e) {
            e.preventDefault();
            initAudio();
            gameState.isDrawing = true;
            const coords = getCanvasCoords(e);
            gameState.strokes.push([coords]);
            gameState.hasDrawn = true;
        }

        function handleMove(e) {
            if (!gameState.isDrawing) return;
            e.preventDefault();

            const coords = getCanvasCoords(e);
            const currentStroke = gameState.strokes[gameState.strokes.length - 1];
            const lastPoint = currentStroke[currentStroke.length - 1];

            // Only add point if moved enough
            const dist = Math.sqrt(Math.pow(coords.x - lastPoint.x, 2) + Math.pow(coords.y - lastPoint.y, 2));
            if (dist > 3) {
                currentStroke.push(coords);
                sounds.draw();

                // Draw immediately for responsiveness
                const lineWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--line-width'));
                ctx.strokeStyle = settings.lineColor;
                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(lastPoint.x, lastPoint.y);
                ctx.lineTo(coords.x, coords.y);
                ctx.stroke();
            }
        }

        function handleEnd() {
            if (!gameState.isDrawing) return;
            gameState.isDrawing = false;

            // Check if drawing is "complete enough"
            const totalPoints = gameState.strokes.reduce((sum, s) => sum + s.length, 0);
            if (totalPoints > 30 && gameState.hasDrawn) {
                // Simple completion check - drawn enough
                setTimeout(() => {
                    sounds.complete();
                    showCelebration();
                }, 300);
            }
        }

        // ===========================================
        // UI
        // ===========================================

        function showCelebration() {
            createConfetti();
            document.getElementById('celebrationShape').textContent = gameState.currentItem;
            document.getElementById('celebration').classList.add('active');
        }

        function createConfetti() {
            const colors = ['#FF6B9D', '#A855F7', '#3B82F6', '#10B981', '#FBBF24', '#F97316'];
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        function goNext() {
            const items = Object.keys(SHAPE_DATA[gameState.category]);
            const idx = items.indexOf(gameState.currentItem);
            const nextIdx = (idx + 1) % items.length;
            loadItem(gameState.category, items[nextIdx]);
        }

        function goPrev() {
            const items = Object.keys(SHAPE_DATA[gameState.category]);
            const idx = items.indexOf(gameState.currentItem);
            const prevIdx = (idx - 1 + items.length) % items.length;
            loadItem(gameState.category, items[prevIdx]);
        }

        function clearDrawing() {
            gameState.strokes = [];
            gameState.hasDrawn = false;
            drawCanvas();
        }

        function updateItemGrid() {
            const grid = document.getElementById('itemGrid');
            const label = document.getElementById('itemLabel');
            const items = Object.keys(SHAPE_DATA[gameState.category]);

            label.textContent = gameState.category === 'letters' ? 'Pick a Letter' :
                               gameState.category === 'numbers' ? 'Pick a Number' : 'Pick a Shape';

            grid.innerHTML = items.map(item => `
                <button class="item-btn ${item === gameState.currentItem ? 'active' : ''}" data-item="${item}">
                    ${item}
                </button>
            `).join('');

            grid.querySelectorAll('.item-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    grid.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    gameState.currentItem = btn.dataset.item;
                });
            });
        }

        // ===========================================
        // EVENT LISTENERS
        // ===========================================

        function setupEventListeners() {
            // Audio unlock
            document.addEventListener('touchstart', () => initAudio(), { once: true });
            document.addEventListener('click', () => initAudio(), { once: true });

            // Canvas events
            canvas.addEventListener('touchstart', handleStart);
            canvas.addEventListener('touchmove', handleMove);
            canvas.addEventListener('touchend', handleEnd);
            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('mousemove', handleMove);
            canvas.addEventListener('mouseup', handleEnd);
            canvas.addEventListener('mouseleave', handleEnd);

            // Buttons
            document.getElementById('clearBtn').addEventListener('click', clearDrawing);
            document.getElementById('soundBtn').addEventListener('click', () => {
                initAudio();
                settings.soundEnabled = !settings.soundEnabled;
                document.getElementById('soundBtn').textContent = settings.soundEnabled ? '🔊' : '🔇';
            });

            document.getElementById('menuBtn').addEventListener('click', () => {
                document.getElementById('categoryOverlay').classList.add('active');
                updateItemGrid();
            });

            document.getElementById('closeMenuBtn').addEventListener('click', () => {
                document.getElementById('categoryOverlay').classList.remove('active');
                loadItem(gameState.category, gameState.currentItem);
            });

            document.getElementById('categoryOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('categoryOverlay')) {
                    document.getElementById('categoryOverlay').classList.remove('active');
                }
            });

            // Category buttons
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    gameState.category = btn.dataset.category;
                    gameState.currentItem = Object.keys(SHAPE_DATA[gameState.category])[0];
                    updateItemGrid();
                });
            });

            // Color picker
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    settings.lineColor = btn.dataset.color;
                });
            });

            // Navigation
            document.getElementById('nextBtn').addEventListener('click', goNext);
            document.getElementById('prevBtn').addEventListener('click', goPrev);

            // Celebration buttons
            document.getElementById('againBtn').addEventListener('click', () => {
                document.getElementById('celebration').classList.remove('active');
                clearDrawing();
            });
            document.getElementById('nextItemBtn').addEventListener('click', () => {
                document.getElementById('celebration').classList.remove('active');
                goNext();
            });
        }

        // ===========================================
        // INIT
        // ===========================================

        document.addEventListener('DOMContentLoaded', () => {
            setupCanvas();
            setupEventListeners();
            loadItem('letters', 'A');

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
        });
    </script>
</body>
</html>
