<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FF6B9D">
    <title>Bimmi Match - Fun Matching Game!</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <style>
        /* ===========================================
           CSS STYLES - Bimmi Boo Inspired Design

           BEGINNER TIP: CSS controls how things LOOK
           Try changing colors and see what happens!
           =========================================== */

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Disable text selection for game feel */
            -webkit-user-select: none;
            user-select: none;
            /* Disable callout on long press (iOS) */
            -webkit-touch-callout: none;
        }

        /*
         * LEARN MORE: The :root selector lets us define CSS variables
         * that we can reuse throughout our styles!
         */
        :root {
            /* Bimmi Boo Color Palette - Bright and Playful! */
            --color-pink: #FF6B9D;
            --color-purple: #A855F7;
            --color-blue: #3B82F6;
            --color-cyan: #06B6D4;
            --color-green: #10B981;
            --color-yellow: #FBBF24;
            --color-orange: #F97316;
            --color-red: #EF4444;

            /* Background gradient colors */
            --bg-start: #FF6B9D;
            --bg-end: #A855F7;

            /* UI Colors */
            --card-bg: #FFFFFF;
            --card-shadow: rgba(0, 0, 0, 0.2);
            --text-dark: #1F2937;
            --text-light: #FFFFFF;

            /* Sizing - Extra large for tiny fingers! */
            --card-size: 140px;
            --card-gap: 16px;
            --border-radius: 24px;
            --button-radius: 50px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            padding-top: max(20px, env(safe-area-inset-top));
        }

        /* ===========================================
           HEADER - Score and Controls
           =========================================== */
        .header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            gap: 10px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-light);
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            letter-spacing: -1px;
        }

        .score-display {
            background: var(--card-bg);
            padding: 12px 24px;
            border-radius: var(--button-radius);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-purple);
            box-shadow: 0 4px 15px var(--card-shadow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-display .star {
            font-size: 1.6rem;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        /* ===========================================
           BUTTONS - Big and Tappable!

           BEGINNER TIP: min-width/height of 44px is
           Apple's recommended touch target size.
           We use 60px+ for little fingers!
           =========================================== */
        .btn {
            min-width: 60px;
            min-height: 60px;
            border: none;
            border-radius: var(--button-radius);
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 4px 15px var(--card-shadow);
        }

        .btn:active {
            transform: scale(0.92);
        }

        .btn-white {
            background: var(--card-bg);
            color: var(--color-purple);
        }

        .btn-colored {
            background: linear-gradient(135deg, var(--color-yellow) 0%, var(--color-orange) 100%);
            color: var(--text-light);
        }

        .btn-green {
            background: linear-gradient(135deg, var(--color-green) 0%, var(--color-cyan) 100%);
            color: var(--text-light);
        }

        /* ===========================================
           GAME CONTAINER
           =========================================== */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            padding: 10px;
        }

        /* ===========================================
           GAME GRID - Where the magic happens!

           LEARN MORE: CSS Grid is perfect for game boards.
           We dynamically set columns based on pair count.
           =========================================== */
        .game-grid {
            display: grid;
            gap: var(--card-gap);
            padding: 20px;
            justify-content: center;
            align-content: center;
        }

        /* ===========================================
           GAME CARDS - The matching tiles
           =========================================== */
        .game-card {
            width: var(--card-size);
            height: var(--card-size);
            background: var(--card-bg);
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 25px var(--card-shadow);
            position: relative;
            overflow: hidden;
        }

        /* Card back (question mark) */
        .game-card::before {
            content: '?';
            position: absolute;
            font-size: 4rem;
            color: #E0E0E0;
            font-weight: 800;
            transition: opacity 0.2s ease;
        }

        /* Hide question mark when card is revealed */
        .game-card.selected::before,
        .game-card.matched::before {
            opacity: 0;
        }

        /* Card content (emoji/color/number) */
        .game-card .card-content {
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 1;
        }

        /* Show content when selected or matched */
        .game-card.selected .card-content,
        .game-card.matched .card-content {
            opacity: 1;
            transform: scale(1);
        }

        /* Selected state - lifted look */
        .game-card.selected {
            transform: scale(1.05);
            box-shadow: 0 12px 35px var(--card-shadow);
            background: linear-gradient(135deg, #FFF 0%, #F0F0FF 100%);
        }

        /* Matched state - celebratory! */
        .game-card.matched {
            background: linear-gradient(135deg, var(--color-green) 0%, var(--color-cyan) 100%);
            transform: scale(1);
            animation: matchPulse 0.5s ease;
        }

        .game-card.matched .card-content {
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* Wrong match shake */
        .game-card.wrong {
            animation: shake 0.4s ease;
            background: linear-gradient(135deg, var(--color-red) 0%, var(--color-orange) 100%);
        }

        /* Touch feedback */
        .game-card:active:not(.matched) {
            transform: scale(0.95);
        }

        /* Color mode - card becomes the color */
        .game-card.color-mode.selected,
        .game-card.color-mode.matched {
            background: var(--card-color);
        }

        .game-card.color-mode .card-content {
            font-size: 2rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* ===========================================
           ANIMATIONS

           PRO TIP: @keyframes define animation sequences
           =========================================== */
        @keyframes matchPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        @keyframes celebrate {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes confetti {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* ===========================================
           CELEBRATION OVERLAY
           =========================================== */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
        }

        .celebration.active {
            display: flex;
        }

        .celebration-content {
            text-align: center;
            animation: celebrate 0.5s ease forwards;
        }

        .celebration-emoji {
            font-size: 8rem;
            animation: float 1s ease-in-out infinite;
        }

        .celebration-text {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-light);
            margin: 20px 0;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
        }

        .celebration-stars {
            font-size: 4rem;
            animation: bounce 0.5s ease infinite;
        }

        .celebration .btn {
            margin-top: 30px;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* Confetti pieces */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            animation: confetti 3s ease-out forwards;
            pointer-events: none;
            z-index: 1001;
        }

        /* ===========================================
           SETTINGS PANEL
           =========================================== */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 900;
        }

        .settings-overlay.active {
            display: flex;
        }

        .settings-panel {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            width: 90%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .settings-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-purple);
            text-align: center;
            margin-bottom: 25px;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .setting-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
            display: block;
        }

        /* Mode buttons - big and tappable */
        .mode-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            min-width: 100px;
            padding: 15px 10px;
            border: 3px solid #E0E0E0;
            border-radius: 16px;
            background: var(--card-bg);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .mode-btn .mode-icon {
            font-size: 2rem;
        }

        .mode-btn.active {
            border-color: var(--color-purple);
            background: linear-gradient(135deg, #F3E8FF 0%, #E9D5FF 100%);
            color: var(--color-purple);
        }

        .mode-btn:active {
            transform: scale(0.95);
        }

        /* Pair count selector */
        .pair-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .pair-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 2rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .pair-btn:active {
            transform: scale(0.9);
        }

        .pair-btn.minus {
            background: linear-gradient(135deg, var(--color-red) 0%, var(--color-orange) 100%);
            color: white;
        }

        .pair-btn.plus {
            background: linear-gradient(135deg, var(--color-green) 0%, var(--color-cyan) 100%);
            color: white;
        }

        .pair-count {
            font-size: 3rem;
            font-weight: 800;
            color: var(--color-purple);
            min-width: 80px;
            text-align: center;
        }

        /* Theme selector */
        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .theme-btn {
            padding: 15px;
            border: 3px solid #E0E0E0;
            border-radius: 16px;
            background: var(--card-bg);
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-btn.active {
            border-color: var(--color-purple);
            background: linear-gradient(135deg, #F3E8FF 0%, #E9D5FF 100%);
        }

        .theme-btn:active {
            transform: scale(0.95);
        }

        /* Sound toggle */
        .sound-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: #F5F5F5;
            border-radius: 16px;
        }

        .sound-toggle-label {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-switch {
            width: 70px;
            height: 40px;
            background: #ccc;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .toggle-switch.active {
            background: var(--color-green);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            top: 4px;
            left: 4px;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .toggle-switch.active::after {
            transform: translateX(30px);
        }

        /* Settings buttons */
        .settings-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .settings-buttons .btn {
            flex: 1;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* ===========================================
           RESPONSIVE DESIGN - iPad Optimized!

           BEGINNER TIP: @media queries change styles
           based on screen size
           =========================================== */

        /* Small phones */
        @media (max-width: 480px) {
            :root {
                --card-size: 100px;
                --card-gap: 10px;
            }

            .title { font-size: 1.3rem; }
            .score-display { padding: 8px 16px; font-size: 1.1rem; }
            .game-card { font-size: 3rem; }
            .game-card::before { font-size: 3rem; }
        }

        /* Large phones / Small tablets */
        @media (min-width: 481px) and (max-width: 768px) {
            :root {
                --card-size: 120px;
                --card-gap: 14px;
            }
        }

        /* iPad / Tablets - Our primary target! */
        @media (min-width: 769px) and (max-width: 1024px) {
            :root {
                --card-size: 150px;
                --card-gap: 18px;
            }

            .title { font-size: 2.2rem; }
            .score-display { font-size: 1.6rem; }
            .game-card { font-size: 5rem; }
            .game-card::before { font-size: 5rem; }
        }

        /* Large tablets / Desktop */
        @media (min-width: 1025px) {
            :root {
                --card-size: 160px;
                --card-gap: 20px;
            }

            .game-card { font-size: 5.5rem; }
            .game-card::before { font-size: 5.5rem; }
        }

        /* Landscape mode adjustments */
        @media (orientation: landscape) and (max-height: 500px) {
            :root {
                --card-size: 90px;
                --card-gap: 10px;
            }

            .header { padding: 5px 20px; }
            .game-card { font-size: 2.8rem; }
            .game-card::before { font-size: 2.8rem; }
        }

        /* iPad landscape */
        @media (min-width: 1024px) and (orientation: landscape) {
            .game-container {
                flex-direction: row;
            }
        }
    </style>
</head>
<body>
    <!-- ===========================================
         HEADER - Score and buttons
         =========================================== -->
    <header class="header">
        <h1 class="title">Bimmi Match!</h1>
        <div class="score-display">
            <span class="star">⭐</span>
            <span id="score">0</span>
        </div>
        <div class="header-buttons">
            <button class="btn btn-white" id="soundBtn" aria-label="Toggle Sound">
                🔊
            </button>
            <button class="btn btn-white" id="settingsBtn" aria-label="Settings">
                ⚙️
            </button>
            <button class="btn btn-colored" id="resetBtn" aria-label="New Game">
                🔄
            </button>
        </div>
    </header>

    <!-- ===========================================
         GAME CONTAINER - Main play area
         =========================================== -->
    <main class="game-container">
        <div class="game-grid" id="gameGrid">
            <!-- Cards will be generated by JavaScript -->
        </div>
    </main>

    <!-- ===========================================
         CELEBRATION OVERLAY - Win screen!
         =========================================== -->
    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div class="celebration-emoji">🎉</div>
            <div class="celebration-text">You Did It!</div>
            <div class="celebration-stars">⭐⭐⭐</div>
            <button class="btn btn-green" id="playAgainBtn">
                Play Again! 🎮
            </button>
        </div>
    </div>

    <!-- ===========================================
         SETTINGS PANEL
         =========================================== -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <h2 class="settings-title">⚙️ Settings</h2>

            <!-- Game Mode -->
            <div class="setting-group">
                <label class="setting-label">Game Mode</label>
                <div class="mode-buttons">
                    <button class="mode-btn active" data-mode="emoji">
                        <span class="mode-icon">😀</span>
                        <span>Emoji</span>
                    </button>
                    <button class="mode-btn" data-mode="colors">
                        <span class="mode-icon">🎨</span>
                        <span>Colors</span>
                    </button>
                    <button class="mode-btn" data-mode="numbers">
                        <span class="mode-icon">🔢</span>
                        <span>Numbers</span>
                    </button>
                </div>
            </div>

            <!-- Emoji Theme (only shown in emoji mode) -->
            <div class="setting-group" id="themeGroup">
                <label class="setting-label">Emoji Theme</label>
                <div class="theme-buttons">
                    <button class="theme-btn active" data-theme="animals">🐶🐱🐰🦊</button>
                    <button class="theme-btn" data-theme="fruits">🍎🍌🍊🍇</button>
                    <button class="theme-btn" data-theme="vehicles">🚗🚕🚌🚎</button>
                    <button class="theme-btn" data-theme="sports">⚽🏀🏈🎾</button>
                </div>
            </div>

            <!-- Number of Pairs -->
            <div class="setting-group">
                <label class="setting-label">Number of Pairs</label>
                <div class="pair-selector">
                    <button class="pair-btn minus" id="pairMinus">−</button>
                    <span class="pair-count" id="pairCount">4</span>
                    <button class="pair-btn plus" id="pairPlus">+</button>
                </div>
            </div>

            <!-- Sound Toggle -->
            <div class="setting-group">
                <div class="sound-toggle">
                    <span class="sound-toggle-label">
                        <span>🔊</span>
                        <span>Sound Effects</span>
                    </span>
                    <div class="toggle-switch active" id="soundToggle"></div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="settings-buttons">
                <button class="btn btn-white" id="closeSettingsBtn">
                    Cancel
                </button>
                <button class="btn btn-green" id="applySettingsBtn">
                    Apply ✓
                </button>
            </div>
        </div>
    </div>

    <script>
        /* ===========================================
           JAVASCRIPT - Game Logic

           BEGINNER TIP: JavaScript makes things interactive!
           Everything between <script> tags is code that runs.

           LEARN MORE: Try changing values and see what happens!
           Use console.log() to see what's happening inside.
           =========================================== */

        // ===========================================
        // GAME DATA - Emojis, Colors, and Numbers
        //
        // CHALLENGE: Add your own emoji themes below!
        // ===========================================

        const EMOJI_SETS = {
            animals: ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'],
            fruits: ['🍎', '🍌', '🍊', '🍇', '🍓', '🍒', '🍑', '🥝'],
            vehicles: ['🚗', '🚕', '🚙', '🚌', '🚎', '🏎️', '🚓', '🚑'],
            sports: ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐', '🏉', '🎱']
        };

        // Bright, kid-friendly colors
        const COLORS = [
            { name: 'Red', hex: '#EF4444' },
            { name: 'Orange', hex: '#F97316' },
            { name: 'Yellow', hex: '#FBBF24' },
            { name: 'Green', hex: '#10B981' },
            { name: 'Blue', hex: '#3B82F6' },
            { name: 'Purple', hex: '#A855F7' },
            { name: 'Pink', hex: '#EC4899' },
            { name: 'Cyan', hex: '#06B6D4' }
        ];

        // Numbers with fun styling
        const NUMBERS = ['1', '2', '3', '4', '5', '6', '7', '8'];

        // ===========================================
        // GAME STATE - Variables that track the game
        //
        // BEGINNER TIP: Variables store information
        // that can change as the game is played
        // ===========================================

        let settings = {
            mode: 'emoji',        // 'emoji' | 'colors' | 'numbers'
            theme: 'animals',     // Only for emoji mode
            pairCount: 4,         // 2-8 pairs
            soundEnabled: true
        };

        let gameState = {
            cards: [],            // All card elements
            selectedCard: null,   // Currently flipped card
            matchedPairs: 0,      // How many pairs found
            score: 0,             // Current score
            isProcessing: false   // Prevents clicking during animations
        };

        // ===========================================
        // SOUND SYSTEM - Web Audio API
        //
        // LEARN MORE: We create sounds with code!
        // No audio files needed. Change frequencies
        // to make different tones.
        // ===========================================

        let audioContext = null;

        /**
         * Initialize the audio system
         * Must be called after user interaction (browser requirement)
         */
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            // Resume if suspended (iOS requirement)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        /**
         * Play a simple tone
         *
         * @param {number} frequency - Pitch in Hz (higher = higher pitch)
         * @param {number} duration - Length in seconds
         * @param {string} type - Wave type: 'sine', 'square', 'triangle'
         *
         * CHALLENGE: Try changing frequencies!
         * - 262 = Middle C
         * - 330 = E
         * - 392 = G
         * - 523 = High C
         */
        function playTone(frequency, duration, type = 'sine') {
            if (!settings.soundEnabled || !audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = type;

            // Start loud, fade out smoothly
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        /**
         * Sound effects for different game events
         * Each sound has its own character!
         */
        const sounds = {
            // Card flip - quick blip
            select: () => playTone(440, 0.1, 'sine'),

            // Correct match - happy rising tone
            match: () => {
                playTone(523, 0.15, 'sine');  // C5
                setTimeout(() => playTone(659, 0.15, 'sine'), 100);  // E5
                setTimeout(() => playTone(784, 0.2, 'sine'), 200);   // G5
            },

            // Wrong match - gentle low tone
            wrong: () => playTone(200, 0.3, 'triangle'),

            // Victory! - Celebration melody
            win: () => {
                const melody = [523, 523, 587, 659, 659, 587, 523, 494, 440, 440, 494, 523, 523, 494, 494];
                const timing = [200, 200, 200, 200, 200, 200, 200, 200, 200, 200, 200, 200, 300, 100, 400];
                let time = 0;
                melody.forEach((freq, i) => {
                    setTimeout(() => playTone(freq, timing[i] / 1000, 'sine'), time);
                    time += timing[i] * 0.8;
                });
            }
        };

        // ===========================================
        // GAME FUNCTIONS - Core game logic
        // ===========================================

        /**
         * Shuffle an array randomly (Fisher-Yates algorithm)
         *
         * LEARN MORE: This is a famous algorithm that
         * gives each item an equal chance of ending up
         * in any position. Very fair shuffling!
         */
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        /**
         * Get the items to match based on current mode
         */
        function getGameItems() {
            switch (settings.mode) {
                case 'emoji':
                    return EMOJI_SETS[settings.theme].slice(0, settings.pairCount);
                case 'colors':
                    return COLORS.slice(0, settings.pairCount);
                case 'numbers':
                    return NUMBERS.slice(0, settings.pairCount);
                default:
                    return EMOJI_SETS.animals.slice(0, settings.pairCount);
            }
        }

        /**
         * Calculate optimal grid layout for the number of cards
         */
        function calculateGridLayout(totalCards) {
            // For small numbers, use simple layouts
            const layouts = {
                4: { cols: 2, rows: 2 },   // 2 pairs
                6: { cols: 3, rows: 2 },   // 3 pairs
                8: { cols: 4, rows: 2 },   // 4 pairs
                10: { cols: 5, rows: 2 },  // 5 pairs
                12: { cols: 4, rows: 3 },  // 6 pairs
                14: { cols: 7, rows: 2 },  // 7 pairs
                16: { cols: 4, rows: 4 }   // 8 pairs
            };
            return layouts[totalCards] || { cols: 4, rows: Math.ceil(totalCards / 4) };
        }

        /**
         * Create and display the game grid
         *
         * This is the main function that sets up the game!
         */
        function createGame() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            // Get items and create pairs
            const items = getGameItems();
            const pairs = [...items, ...items]; // Duplicate for pairs
            const shuffledPairs = shuffleArray(pairs);

            // Calculate and apply grid layout
            const layout = calculateGridLayout(shuffledPairs.length);
            grid.style.gridTemplateColumns = `repeat(${layout.cols}, var(--card-size))`;

            // Create card elements
            gameState.cards = shuffledPairs.map((item, index) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.dataset.index = index;

                // Store the value for matching
                if (settings.mode === 'colors') {
                    card.dataset.value = item.hex;
                    card.classList.add('color-mode');
                    card.style.setProperty('--card-color', item.hex);
                    card.innerHTML = `<span class="card-content">${item.name}</span>`;
                } else if (settings.mode === 'numbers') {
                    card.dataset.value = item;
                    card.innerHTML = `<span class="card-content" style="font-weight:800; color: var(--color-purple);">${item}</span>`;
                } else {
                    card.dataset.value = item;
                    card.innerHTML = `<span class="card-content">${item}</span>`;
                }

                // Add click/touch handler
                card.addEventListener('click', () => handleCardClick(card));

                grid.appendChild(card);
                return card;
            });

            // Reset game state
            gameState.selectedCard = null;
            gameState.matchedPairs = 0;
            gameState.isProcessing = false;
        }

        /**
         * Handle when a card is clicked/tapped
         *
         * This is the heart of the game logic!
         *
         * BEGINNER TIP: Read through this step by step
         * to understand how matching works.
         */
        function handleCardClick(card) {
            // Initialize audio on first interaction
            initAudio();

            // Ignore clicks if:
            // - Currently processing a match/mismatch
            // - Card is already matched
            // - Same card clicked twice
            if (gameState.isProcessing) return;
            if (card.classList.contains('matched')) return;
            if (card === gameState.selectedCard) return;

            // Reveal the card
            card.classList.add('selected');
            sounds.select();

            // Is this the first card?
            if (!gameState.selectedCard) {
                gameState.selectedCard = card;
                return;
            }

            // Second card clicked - check for match!
            gameState.isProcessing = true;
            const firstCard = gameState.selectedCard;
            const secondCard = card;

            // Compare values
            if (firstCard.dataset.value === secondCard.dataset.value) {
                // MATCH! 🎉
                handleMatch(firstCard, secondCard);
            } else {
                // No match 😅
                handleMismatch(firstCard, secondCard);
            }
        }

        /**
         * Handle a successful match
         */
        function handleMatch(card1, card2) {
            // Add matched styling
            card1.classList.remove('selected');
            card2.classList.remove('selected');
            card1.classList.add('matched');
            card2.classList.add('matched');

            // Play match sound
            sounds.match();

            // Update score and state
            gameState.score += 10;
            gameState.matchedPairs++;
            updateScoreDisplay();

            // Reset for next turn
            gameState.selectedCard = null;
            gameState.isProcessing = false;

            // Check for win!
            if (gameState.matchedPairs === settings.pairCount) {
                setTimeout(handleWin, 500);
            }
        }

        /**
         * Handle a mismatch
         */
        function handleMismatch(card1, card2) {
            // Show wrong animation
            card1.classList.add('wrong');
            card2.classList.add('wrong');

            // Play wrong sound
            sounds.wrong();

            // Hide cards after a delay (longer for younger kids!)
            setTimeout(() => {
                card1.classList.remove('selected', 'wrong');
                card2.classList.remove('selected', 'wrong');

                gameState.selectedCard = null;
                gameState.isProcessing = false;
            }, 1000); // 1 second delay - good for 4-year-olds
        }

        /**
         * Handle winning the game!
         */
        function handleWin() {
            sounds.win();
            createConfetti();
            document.getElementById('celebration').classList.add('active');
        }

        /**
         * Create colorful confetti animation
         */
        function createConfetti() {
            const colors = ['#FF6B9D', '#A855F7', '#3B82F6', '#10B981', '#FBBF24', '#F97316'];
            const confettiCount = 50;

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-20px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';

                document.body.appendChild(confetti);

                // Remove after animation
                setTimeout(() => confetti.remove(), 5000);
            }
        }

        /**
         * Update the score display
         */
        function updateScoreDisplay() {
            document.getElementById('score').textContent = gameState.score;
        }

        /**
         * Reset the game
         */
        function resetGame() {
            gameState.score = 0;
            updateScoreDisplay();
            document.getElementById('celebration').classList.remove('active');
            createGame();
        }

        // ===========================================
        // SETTINGS FUNCTIONS
        // ===========================================

        function openSettings() {
            document.getElementById('settingsOverlay').classList.add('active');
            updateSettingsUI();
        }

        function closeSettings() {
            document.getElementById('settingsOverlay').classList.remove('active');
        }

        function updateSettingsUI() {
            // Update mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === settings.mode);
            });

            // Update theme buttons
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === settings.theme);
            });

            // Show/hide theme selector based on mode
            document.getElementById('themeGroup').style.display =
                settings.mode === 'emoji' ? 'block' : 'none';

            // Update pair count
            document.getElementById('pairCount').textContent = settings.pairCount;

            // Update sound toggle
            document.getElementById('soundToggle').classList.toggle('active', settings.soundEnabled);
        }

        function applySettings() {
            closeSettings();
            resetGame();
        }

        // ===========================================
        // EVENT LISTENERS - Wire up the UI
        //
        // BEGINNER TIP: Event listeners "listen" for
        // things like clicks and run code when they happen
        // ===========================================

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize the game
            createGame();

            // Header buttons
            document.getElementById('resetBtn').addEventListener('click', () => {
                initAudio();
                resetGame();
            });

            document.getElementById('settingsBtn').addEventListener('click', () => {
                initAudio();
                openSettings();
            });

            document.getElementById('soundBtn').addEventListener('click', () => {
                initAudio();
                settings.soundEnabled = !settings.soundEnabled;
                document.getElementById('soundBtn').textContent =
                    settings.soundEnabled ? '🔊' : '🔇';
            });

            // Play again button
            document.getElementById('playAgainBtn').addEventListener('click', () => {
                resetGame();
            });

            // Settings panel
            document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
            document.getElementById('applySettingsBtn').addEventListener('click', applySettings);

            // Close settings when clicking overlay
            document.getElementById('settingsOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('settingsOverlay')) {
                    closeSettings();
                }
            });

            // Mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    settings.mode = btn.dataset.mode;
                    updateSettingsUI();
                });
            });

            // Theme buttons
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    settings.theme = btn.dataset.theme;
                    updateSettingsUI();
                });
            });

            // Pair count buttons
            document.getElementById('pairMinus').addEventListener('click', () => {
                if (settings.pairCount > 2) {
                    settings.pairCount--;
                    updateSettingsUI();
                }
            });

            document.getElementById('pairPlus').addEventListener('click', () => {
                if (settings.pairCount < 8) {
                    settings.pairCount++;
                    updateSettingsUI();
                }
            });

            // Sound toggle
            document.getElementById('soundToggle').addEventListener('click', () => {
                settings.soundEnabled = !settings.soundEnabled;
                updateSettingsUI();
            });

            // Register service worker for PWA
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            }
        });

        // Prevent pull-to-refresh on mobile (can interfere with game)
        document.body.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
