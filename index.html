<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#FF6B9D">
    <title>Bimmi Games - Fun Learning Games!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B9D 0%, #A855F7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .title {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            font-size: 1.3rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
            text-align: center;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 900px;
            width: 100%;
        }

        .game-card {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .game-card:active {
            transform: scale(0.96);
        }

        @media (hover: hover) {
            .game-card:hover {
                transform: translateY(-8px);
                box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            }
        }

        .game-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            display: block;
        }

        .game-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 10px;
        }

        .game-desc {
            font-size: 1.1rem;
            color: #6B7280;
            line-height: 1.5;
        }

        .game-card.matching {
            border-bottom: 6px solid #10B981;
        }

        .game-card.drawing {
            border-bottom: 6px solid #3B82F6;
        }

        .coming-soon {
            opacity: 0.5;
            pointer-events: none;
        }

        .coming-soon .game-title::after {
            content: ' (Coming Soon)';
            font-size: 0.7em;
            color: #9CA3AF;
        }

        @media (max-width: 600px) {
            .title { font-size: 2.2rem; }
            .game-card { padding: 30px 20px; }
            .game-icon { font-size: 4rem; }
            .game-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <h1 class="title">🎮 Bimmi Games</h1>
    <p class="subtitle">Fun learning games for kids!</p>

    <div class="games-grid">
        <a href="matching/" class="game-card matching">
            <span class="game-icon">🎯</span>
            <h2 class="game-title">Bimmi Match</h2>
            <p class="game-desc">Match pairs of emojis, colors, or numbers. Train your memory!</p>
        </a>

        <a href="drawing/" class="game-card drawing">
            <span class="game-icon">✏️</span>
            <h2 class="game-title">Dot to Dot</h2>
            <p class="game-desc">Connect the dots to reveal letters, numbers, and shapes!</p>
        </a>
    </div>
</body>
</html>
